# Publica SOMENTE a pasta app/ (o leitor offline) no GitHub Pages. As obras nunca entram aqui.
name: Publicar app

on:
  push:
    branches: [main, master]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Marcar a versão (código do commit) no service worker
        run: sed -i "s/__VERSAO__/${GITHUB_SHA::7}/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
