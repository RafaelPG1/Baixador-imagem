<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Leitor</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="atualiza" class="faixa" hidden role="status">
  <span>Nova versão do app disponível.</span>
  <button id="atualiza-ok" type="button">Atualizar agora</button>
</div>
<header class="topo" id="topo">
  <a class="marca" href="#/">Leitor</a>
  <div class="topo-acoes">
    <button id="importar" type="button" class="btn principal">Importar</button>
    <a class="btn" href="#/ajustes">Ajustes</a>
  </div>
</header>
<input id="arquivos" type="file" accept=".zip,application/zip" multiple hidden>
<main id="tela"></main>
<div id="toast" class="toast" hidden role="status"></div>
<script src="zip.js"></script>
<script src="ajuste.js"></script>
<script src="app.js"></script>
</body>
</html>
